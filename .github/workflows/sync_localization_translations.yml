name: Sync localization strings with CurseForge

# Full localization sync loop:
#   1. Extract every L["..."] string used in the addon's Lua files.
#   2. Upload new/unknown strings to CurseForge so translators have something to translate.
#   3. Regenerate Locales/enUS.lua from the same code scan (mechanical - see
#      Source/localization_tool.py's cmd_generate_enus docstring), pull the current
#      translations for the other locales back down, and propose both via a PR.
#
# Only locales that are actually <Script>-loaded in Locales/Locales.xml are touched. Several
# locale files exist in the repo but are commented out there on purpose (translation quality too
# low to ship) - this workflow must never re-enable them or overwrite that decision, and never
# touches Locales.xml itself. enUS.lua is no longer hand-edited - it's fully derived from the code
# scan (plus Source/LocalizationSpecialPhraseKeys.lua for documented key != value overrides like
# L["Minuss"] = "Minors") - but still goes through the same PR review as every other locale rather
# than being committed directly, so an unexpected regeneration (e.g. a key that should have been
# added to LocalizationSpecialPhraseKeys.lua as a documented override, but wasn't) can be caught
# before merge. Note: generate-enus runs without --prune here, so keys the scan no longer finds
# are kept, not deleted - see cmd_generate_enus's docstring for why.
#
# All steps are implemented by Source/localization_tool.py (AST-based - see that file's
# docstring for why this replaced the old regex-based Source/ExtractPhraseKeysForLocalization.lua
# + Source/import_localization_phrase_keys.sh + inline bash pull-back).
#
# Triggers:
#   - push to main, release/* or hotfix/*: pick up new strings as soon as they land.
#   - weekly schedule: catches translation updates made directly on CurseForge, which can happen
#     without any code commit here.
#   - workflow_dispatch: manual run.
# The push trigger is scoped to these branches (not "all branches"): the PR step below pushes its
# own commits to a localization-sync-* branch, and a trigger that also matched that branch would
# re-run this workflow on its own output.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main, "release/*", "hotfix/*"]
    paths:
      - "**.lua"
      - "Locales/**"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Skip the run created by merging this workflow's own localization-sync-* PR back into a
    # trigger branch - that merge touches Locales/** so the push trigger above fires again, but
    # re-running would just re-extract/re-upload/re-pull the same content that PR just landed
    # (idempotent, no new PR gets opened) - wasted CI time and CF API calls. GitHub's default
    # merge-commit, squash, and rebase messages all include the PR title, so matching that string
    # catches all three merge strategies (breaks only if someone hand-edits the merge message).
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Update localization files from CurseForge')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install luaparser
        run: pip install luaparser

      - name: Extract phrase keys (strings that have to be translated) from lua files
        run: python Source/localization_tool.py extract

      - name: Upload new phrase keys to CurseForge
        run: python Source/localization_tool.py upload --token "$CF_API_KEY"

      - name: Regenerate Locales/enUS.lua from the code scan
        run: python Source/localization_tool.py generate-enus

      - name: Pull current CurseForge translations into Locales/*.lua
        run: python Source/localization_tool.py pull --token "$CF_API_KEY"

      - name: Open pull request with updated translations
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update localization files from CurseForge"
          title: "Update localization files from CurseForge"
          body: |
            Automated sync of community translations from CurseForge.

            - `Locales/enUS.lua` is regenerated mechanically from the current code scan
              (`L["key"] = "key"`, with documented overrides from
              `Source/LocalizationSpecialPhraseKeys.lua` applied) - review before merging like
              any other change, it is not committed directly.
            - Other locale files are only updated for locales currently enabled in
              `Locales/Locales.xml`.
            - Disabled locales (commented out in `Locales.xml`, e.g. for translation-quality
              reasons) are intentionally skipped.

            Please review the diff for translation quality before merging.
          branch: localization-sync-${{ github.ref_name }}
          delete-branch: true
