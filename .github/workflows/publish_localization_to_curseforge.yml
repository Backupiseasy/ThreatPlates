name: Publish localization to CurseForge

# Merge-gated counterpart to sync_localization_translations.yml, which only ever pulls
# translations down. enUS and deDE are maintained in this repository and never edited on
# CurseForge, so after the sync PR (with the deDE gaps filled locally via
# Source/mt_translate_prompt.md) is merged into main, this workflow pushes both:
#   1. The enUS source phrases -> CurseForge (so community translators have something to
#      translate), via `upload` (DeletePhrase, also purges phrases no longer used).
#   2. Every deDE translation -> CurseForge, machine translations included, via
#      `push-translation` (DoNothing - see select_keys_for_push() in
#      Source/localization_tool.py). Local corrections of already uploaded texts reach
#      CurseForge the same way. No `pull` beforehand: it would replace local texts with
#      CurseForge's older ones.
#
# Triggers:
#   - push to main changing Locales/enUS.lua or Locales/deDE.lua: the merge of the sync
#     PR into main, the later merge of a release/* branch a sync PR was merged into, or a
#     direct change of these files on main. Never on release/* itself: CurseForge is shared
#     by all branches, and `upload` (DeletePhrase) would delete the phrases of strings that
#     exist on main but not on the release branch.
#   - workflow_dispatch: manual run. Idempotent - this workflow makes no commits.
#
# The sync workflow may also run on such a push and pull deDE before this workflow has
# uploaded it - `pull` keeps the local deDE texts (REPO_AUTHORITATIVE_LOCALES in
# Source/localization_tool.py), so its PR does not revert them.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Locales/enUS.lua"
      - "Locales/deDE.lua"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install luaparser
        run: pip install luaparser

      - name: Extract phrase keys (strings that have to be translated) from lua files
        run: python Source/localization_tool.py extract

      - name: Upload new phrase keys to CurseForge
        run: python Source/localization_tool.py upload --token "$CF_API_KEY"

      - name: Upload all deDE translations to CurseForge
        run: python Source/localization_tool.py push-translation --locale deDE --token "$CF_API_KEY"
