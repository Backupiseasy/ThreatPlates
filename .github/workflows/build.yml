# Packages and publishes a stable release to CurseForge, WoWInterface, Wago, and GitHub.
# Triggers on a version tag (e.g. "13.0.24") - explicitly excluding "-alpha"/"-beta" tags,
# which are handled by build_alpha.yml/build_beta.yml instead. Builds a single unified
# package (retail/classic/bcc/mists) from the same multi-version .toc.
#
# Actual packaging logic lives in the reusable workflow _package_release.yml - this file
# only owns the release-channel-specific trigger, naming, and which secrets are forwarded.
name: Package and release version

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "!**-beta**"
      - "!**-alpha**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package and release (e.g. 13.0.24)"
        required: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/_package_release.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
    secrets:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
